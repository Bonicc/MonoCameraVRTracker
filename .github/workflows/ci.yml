name: prototype-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,camera]"
      - run: python -m pytest -q
      - run: python -m monovrtrack demo --frames 30 --rate 0 --no-udp
  driver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S driver/openvr -B build/openvr -A x64
      - run: cmake --build build/openvr --config Release
      - run: ctest --test-dir build/openvr -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: monovrtrack-openvr-windows
          path: build/openvr/monocameravrtracker/
